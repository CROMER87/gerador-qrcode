<head>
 <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1403803751341043"
     crossorigin="anonymous"></script>
</head>

<div class="caixa">
  <div class="box">
    <form class="form" (submit)="onSubmit()">
      <textarea
        id="message"
        name="message"
        class="form-control"
        [(ngModel)]="text"
        placeholder="Ensira seu texto aqui"
      ></textarea>
      <button type="submit" class="btn btn-primary">Gerar QR Code</button>
    </form>
    <div class="qrcode">
      <img *ngIf="qrcode" [src]="qrcode" alt="QR Code" />
      <button
        style="margin-left: 60px"
        *ngIf="qrcode"
        class="btn btn-primary"
        (click)="salvarQrCode()"
      >
        Download
      </button>
    </div>
  </div>
  <button class="btn btn-outline-primary" (click)="voltarHome()">
    <span class="mr-2"></span> Voltar
  </button>
</div>
