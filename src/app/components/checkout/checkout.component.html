<div class="checkout-container">
  <mat-card>
    <mat-card-content>
      <!-- Estado de carregamento -->
      <div class="loading-container" *ngIf="loading">
        <mat-spinner diameter="50"></mat-spinner>
        <p>Carregando informações do plano...</p>
      </div>

      <!-- Estado de erro -->
      <div class="error-container" *ngIf="error">
        <mat-icon color="warn">error</mat-icon>
        <p>{{ error }}</p>
        <button mat-raised-button color="primary" (click)="retry()">
          Tentar novamente
        </button>
      </div>

      <!-- Estado de redirecionamento -->
      <div class="redirecting-container" *ngIf="redirecting">
        <mat-spinner diameter="50"></mat-spinner>
        <p>Redirecionando para o pagamento...</p>
      </div>

      <!-- Conteúdo principal -->
      <div class="checkout-container" *ngIf="!loading && !error && !redirecting && plan">
        <mat-card>
          <mat-card-header>
            <mat-card-title>{{ plan.name }}</mat-card-title>
          </mat-card-header>
          
          <mat-card-content>
            <div class="price">
              <span class="currency">R$</span>
              <span class="amount">{{ plan.price.toFixed(2) }}</span>
              <span class="period">/mês</span>
            </div>

            <ul class="features">
              <li *ngFor="let feature of plan.features">
                <mat-icon>check</mat-icon>
                {{ feature }}
              </li>
            </ul>
          </mat-card-content>

          <mat-card-actions>
            <button mat-raised-button color="primary" (click)="proceedToPayment()">
              Prosseguir para pagamento
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
    </mat-card-content>
  </mat-card>
</div>
